services:
  - type: web
    name: aurelia-store-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aurelia-store-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: aurelia-store-db
    databaseName: aurelia_store
    user: aurelia_store
    region: singapore
