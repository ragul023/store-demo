name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: https://aura-store-tawny-three.vercel.app/
      DATABASE_URL: postgresql://neondb_owner:npg_kxmt4FQGB2Zq@ep-damp-mud-b3m4hlxs-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      DATABASE_SSL: 'true'
      JWT_SECRET: ci-only-placeholder-secret-not-used-for-deployment
      VITE_API_URL: https://store-demo-cvd1.onrender.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Build production frontend
        run: npm run build --prefix client

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Validate production API configuration
        run: npm run check:production-config --prefix server
